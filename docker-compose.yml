services:
  pipeline:
    build: .
    container_name: glucose_pipeline
    command: ["python3", "main.py", "loop", "--skip-extract"]
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - outputs_data:/app/outputs
      - ./dados_glicose_final.json:/app/dados_glicose_final.json
    restart: unless-stopped

  dashboard:
    build: .
    container_name: glucose_dashboard
    command: ["python3", "dashboard_server.py", "--host", "0.0.0.0", "--port", "8000", "--skip-extract", "--no-background-pipeline"]
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - outputs_data:/app/outputs
      - ./dados_glicose_final.json:/app/dados_glicose_final.json
    ports:
      - "8000:8000"
    depends_on:
      - pipeline
    restart: unless-stopped

  telegram_bot:
    build: .
    container_name: glucose_telegram_bot
    command: ["python3", "telegram_ai_bot.py"]
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - outputs_data:/app/outputs
      - ./dados_glicose_final.json:/app/dados_glicose_final.json
      - ./metabolic_twin/artifacts:/app/metabolic_twin/artifacts
    depends_on:
      - pipeline
    restart: unless-stopped

volumes:
  outputs_data:
